name: Verify all live concept purchase links
on:
  push:
    branches: [main]
    paths:
      - 'astro/public/concept-websites/**'
      - 'astro/public/demos/jemoba/**'
      - '.github/workflows/verify-live-concept-links.yml'
  workflow_dispatch:
jobs:
  verify-live-concepts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify all current production concept routes and personalised purchase links
        shell: bash
        run: |
          python3 - <<'PY'
          import pathlib, urllib.request, urllib.error, re, time, sys, json, concurrent.futures
          root=pathlib.Path("astro/public")
          files=sorted((root/"concept-websites").glob("*/index.html"))+[root/"demos/jemoba/index.html"]
          assert files, "No concept pages found"
          def verify(f):
              failures=[]
              slug=f.parent.name
              route="/"+f.parent.relative_to(root).as_posix()+"/"
              url="https://uktradewebsites.co.uk"+route
              expected="https://prunusmedia.com/buy-now/?concept="+slug
              local=f.read_text(encoding="utf-8")
              if expected not in local: failures.append(f"{route}: missing local personalised link")
              if re.search(r"""<a\b[^>]*\bhref=["'](?:https://(?:www\.)?uktradewebsites\.co\.uk/?|https://wa\.me/447789545807[^"']*)["']""",local,re.I): failures.append(f"{route}: old sales destination remains")
              # Deployment and registration may finish after this workflow starts.
              status=0;html="";ready=False
              for attempt in range(12):
                  try:
                      req=urllib.request.Request(url+"?verify="+str(time.time_ns()),headers={"User-Agent":"Mozilla/5.0 (compatible; PrunusConceptProductionVerifier/1.0)","Cache-Control":"no-cache"})
                      with urllib.request.urlopen(req,timeout=25) as response:
                          status=response.status
                          html=response.read().decode("utf-8","replace")
                      quote_req=urllib.request.Request('https://portal.prunusmedia.com/api/website-sales/quote?concept='+slug,headers={'Origin':'https://prunusmedia.com','Cache-Control':'no-cache'})
                      with urllib.request.urlopen(quote_req,timeout=25) as response:
                          quote=json.load(response)
                      ready=quote.get('ok') and quote.get('prospect',{}).get('preview_url')==url and quote.get('enabled') and bool(quote.get('enabled_plans'))
                      if expected in html and ready: break
                  except Exception as e:
                      if attempt==11: failures.append(f'{route}: fetch failed: {type(e).__name__}: {e}')
                  if attempt<11: time.sleep(15)
              checks={
                "HTTP 200":status==200,
                "registered live quote and available plans":bool(ready),
                "personalised Buy Now link":expected in html,
                "noindex":bool(re.search(r'<meta[^>]+name=["\\\']robots["\\\'][^>]+content=["\\\'][^"\\\']*noindex',html,re.I)),
                "mobile navigation toggle":bool(re.search(r'<button\b[^>]*aria-controls=["\\\'][^"\\\']+["\\\']',html,re.I) or re.search(r'<details\b[^>]*class=["\\\'][^"\\\']*menu[^"\\\']*["\\\'][^>]*>\s*<summary\b',html,re.I) or re.search(r'(menu-toggle|nav-toggle|hamburger)',html,re.I)),
              }
              for key,ok in checks.items():
                  if not ok: failures.append(f"{route}: {key} failed")
              print(f"{'PASS' if all(checks.values()) else 'FAIL'} {url} "+", ".join(k for k,v in checks.items() if not v))
              return failures
          with concurrent.futures.ThreadPoolExecutor(max_workers=8) as pool:
              failures=[failure for group in pool.map(verify,files) for failure in group]
          print(f"Verified {len(files)} routes; failures: {len(failures)}")
          for failure in failures: print("ERROR:",failure)
          if failures: sys.exit(1)
          PY
