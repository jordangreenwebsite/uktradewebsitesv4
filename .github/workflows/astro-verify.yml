name: Astro preview quality checks
on:
  pull_request:
    paths:
      - "astro/**"
      - ".github/workflows/astro-verify.yml"
  workflow_dispatch:
jobs:
  astro-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: astro
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: astro/package-lock.json
      - run: npm install --no-audit --no-fund
      - run: npm run build
