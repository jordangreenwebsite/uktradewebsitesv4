name: Astro build and SEO checks
on:
  push:
    branches: [main]
    paths:
      - "astro/**"
      - ".github/workflows/astro-verify.yml"
  pull_request:
    paths:
      - "astro/**"
      - ".github/workflows/astro-verify.yml"
  workflow_dispatch:
jobs:
  astro-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: astro
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --no-audit --no-fund
      - run: npm run build
      - run: npm install --no-save playwright
      - run: npx playwright install --with-deps chromium
      - run: node scripts/browser-qa.mjs
      - name: Diagnose live robots and broken links
        run: node scripts/diagnose-live.mjs
      - name: Compare production header appearance with local build
        run: node scripts/diagnose-live-header.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: uk-trade-websites-astro-static-build
          path: astro/dist/
          if-no-files-found: error
          retention-days: 14
