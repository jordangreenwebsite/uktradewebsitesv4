name: Verify public Cloudflare routes
on:
  push:
    branches: [main]
    paths:
      - "astro/**"
      - ".github/workflows/production-routes-smoke.yml"
  workflow_dispatch:
jobs:
  production-urls:
    runs-on: ubuntu-latest
    steps:
      - name: Wait for deployment and check published URLs
        shell: bash
        run: |
          set -euo pipefail
          # Cloudflare Pages builds independently of GitHub Actions and may take
          # longer than a fixed 40s delay. Poll real public URLs and new content.
          urls=(
            "https://uktradewebsites.co.uk/"
            "https://uktradewebsites.co.uk/blog/"
            "https://uktradewebsites.co.uk/blog/index.html"
            "https://uktradewebsites.co.uk/blog/what-should-a-trade-business-website-include/"
            "https://uktradewebsites.co.uk/websites-for-pressure-washers/"
            "https://uktradewebsites.co.uk/websites-for-driveway-cleaners/"
          )
          for attempt in {1..10}; do
            echo "Checking Cloudflare production (attempt $attempt/10)"
            errors=0
            for url in "${urls[@]}"; do
              temp=$(mktemp)
              status=$(curl -sSL --max-time 18 --retry 1 \
                --header "Cache-Control: no-cache" \
                --output "$temp" --write-out "%{http_code}" \
                "${url}?ci-route-check=${GITHUB_SHA:0:8}&attempt=$attempt") || status="000"
              title=$(grep -oim1 '<title>[^<]*</title>' "$temp" | head -1 || true)
              printf 'HTTP %s | %s | %s\n' "$status" "${title:-No title}" "$url"
              [[ "$status" == "200" ]] || errors=$((errors+1))
              case "$url" in
                "https://uktradewebsites.co.uk/blog/" | "https://uktradewebsites.co.uk/blog/index.html")
                  grep -q "The UK Trade Websites Blog" "$temp" || errors=$((errors+1))
                  grep -q 'data-blog-search' "$temp" || errors=$((errors+1))
                  ;;
                "https://uktradewebsites.co.uk/blog/what-should-a-trade-business-website-include/")
                  grep -q "What Should a Trade Business Website Include" "$temp" || errors=$((errors+1))
                  grep -q 'blog-read-next-band' "$temp" || errors=$((errors+1))
                  ;;
              esac
              rm -f "$temp"
            done
            if (( errors == 0 )); then
              echo "SUCCESS: Public Cloudflare URLs and the current blog features verified."
              exit 0
            fi
            if (( attempt < 10 )); then
              echo "Deployment not fully live ($errors checks pending); checking again shortly."
              sleep 20
            fi
          done
          echo "::error::Cloudflare is not serving the expected production routes or latest features after repeated checks; inspect the Pages production deployment and cache."
          exit 1
